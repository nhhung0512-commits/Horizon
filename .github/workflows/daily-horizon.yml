name: Daily Horizon (MOF/Env-Chem) + Supabase Push

on:
  schedule:
    # UTC 22:00 == 05:00 Asia/Ho_Chi_Minh (UTC+7)
    - cron: '0 22 * * *'
  workflow_dispatch:      # Allow manual trigger
    inputs:
      hours:
        description: 'Lookback window in hours (manual runs only; scheduled runs always use 24)'
        required: false
        default: '24'

jobs:
  daily-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Prepare config
        run: cp data/config.ci.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours ${{ github.event.inputs.hours || '24' }}

      - name: Push results to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python scripts/push_to_supabase.py
